[build-system]
requires = [
    "setuptools", "wheel",
    "numpy", "pybind11", "cmake",
    "scikit-build", "ninja; platform_system != 'Windows'",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Calling non-taichi function",
    "ignore:`np.int` is a deprecated alias",
    "ignore:Operator \"is\" in Taichi scope is deprecated",
    "ignore:Operator \"is not\" in Taichi scope is deprecated"
]

[tool.yapf]
based_on_style = "pep8"
blank_line_before_nested_class_or_def = false

[tool.pdm]
distribution = true

[project]
name = "taichi"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "whitingyan", email = "1712428442@qq.com"},
]
dependencies = [
    "cmake",
    "colorama",
    "coverage",
    "Pillow",
    "pybind11",
    "GitPython",
    "yapf",
    "distro",
    "isort",
    "pylint",
    "requests",
    "twine",
    "wheel",
    "astunparse",
    "pre-commit",
    "scikit-build",
    "numpy",
    "ninja; platform_system != \"Windows\"",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

